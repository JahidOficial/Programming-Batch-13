<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tea House</title>
    <!-- style css -->
    <link rel="stylesheet" href="style.css">
    <!-- tailwind css -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- google font - manrope font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet">

    <!-- font awesome cdn-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

    <!-- Internal css -->
    <style>
        /* Manrope font for all elements */
        *{
            font-family: "Manrope", sans-serif;
        }
    </style>
</head>
<body>
    
    <!-- banner section -->
     <section class="grid grid-cols-2 container border border-red-500 mx-auto"> 
        <div class="banner-left">
            <h2 class="text-[80px] font-bold">It's good <br> tea time at The <br> Tea House</h2>
            <p class="text-[#777777] my-[30px]">Tea and Botanical Solutions Supplier Give Optimum <br> Satisfaction To Your Taste Buds.</p>
            <button class="py-3 px-5 rounded-md text-white font-semibold bg-linear-to-r from-[#ff8938] to-[#ff0000]">Explore More 
                <span class="rotate-[-45deg] inline-block"><i class="fa-solid fa-arrow-right"></i></span>
            </button>
        </div>
        <div class="banner-right">
            <img src="images/banner.png" alt="">
        </div>
     </section>
    
</body>
</html>
